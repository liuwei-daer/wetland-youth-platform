# 静态站点：Vue Router History 模式
# 部署：将 pnpm build 产物整目录放到 root 下（默认目录名为 wetland-dist，内含 index.html 与 assets/）
#
# 用法：复制到服务器如 /etc/nginx/conf.d/wetland.conf 后执行 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    index index.html;

    large_client_header_buffers 4 16k;
    client_max_body_size 30m;
    client_body_buffer_size 128k;

    # 以下 proxy_* 仅在与上游反代共用时才有意义；纯静态可删
    proxy_connect_timeout 300;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_buffer_size 64k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    root /var/www/wetland/html/wetland-dist;

    # 必须：任意路径回退到 index.html，否则直接访问 /about 等会白屏
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存静态资源（含本项目使用的 webp）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 不缓存 HTML，避免发版后用户仍拿到旧入口
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript
        application/x-javascript application/xml+rss
        application/javascript application/json;
    gzip_min_length 1000;
}
