# Vue Router History 模式：直接访问 /about、/projects/starter 等路径时，
# 必须由 Nginx 回退到 index.html，否则会白屏或 404。
#
# 将 root 改为你服务器上实际存放构建产物的目录（本项目 pnpm build 默认输出为 wetland-dist/）。

server {
    listen 80;
    server_name _;

    # 构建产物目录：内含 index.html 与 assets/
    root /var/www/wetland-youth-platform/wetland-dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（可选）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
